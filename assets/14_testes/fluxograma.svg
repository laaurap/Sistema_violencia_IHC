<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 220" width="100%" height="220" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1180" height="220" rx="12" fill="#0f172a" />
  <text x="590" y="34" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle">Fluxo do Processo de Avaliação de Usabilidade por Observação (Entrega 14)</text>

  <!-- Definição da seta -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Etapa 1 -->
  <rect x="20" y="65" width="122" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="81" y="92" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">1. Planejamento</text>
  <text x="81" y="114" fill="#cbd5e1" font-size="10" text-anchor="middle">Metas, roteiro</text>
  <text x="81" y="128" fill="#cbd5e1" font-size="10" text-anchor="middle">e tarefas UT01–05</text>
  <text x="81" y="148" fill="#94a3b8" font-size="9" text-anchor="middle">+ Teste Piloto</text>

  <line x1="142" y1="120" x2="162" y2="120" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Etapa 2 -->
  <rect x="165" y="65" width="122" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="226" y="92" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">2. Recrutamento</text>
  <text x="226" y="114" fill="#cbd5e1" font-size="10" text-anchor="middle">Seleção perfil</text>
  <text x="226" y="128" fill="#cbd5e1" font-size="10" text-anchor="middle">proxy (U01)</text>
  <text x="226" y="148" fill="#94a3b8" font-size="9" text-anchor="middle">externo à equipe</text>

  <line x1="287" y1="120" x2="307" y2="120" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Etapa 3 -->
  <rect x="310" y="65" width="122" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="371" y="92" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">3. Consentimento</text>
  <text x="371" y="114" fill="#cbd5e1" font-size="10" text-anchor="middle">Termo TCLE,</text>
  <text x="371" y="128" fill="#cbd5e1" font-size="10" text-anchor="middle">anonimização</text>
  <text x="371" y="148" fill="#94a3b8" font-size="9" text-anchor="middle">e aviso de gravação</text>

  <line x1="432" y1="120" x2="452" y2="120" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Etapa 4 -->
  <rect x="455" y="65" width="122" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="516" y="92" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">4. Preparação</text>
  <text x="516" y="114" fill="#cbd5e1" font-size="10" text-anchor="middle">Link Figma v1.0,</text>
  <text x="516" y="128" fill="#cbd5e1" font-size="10" text-anchor="middle">captura de tela</text>
  <text x="516" y="148" fill="#94a3b8" font-size="9" text-anchor="middle">e briefing inicial</text>

  <line x1="577" y1="120" x2="597" y2="120" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Etapa 5 -->
  <rect x="600" y="65" width="126" height="110" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.8" />
  <text x="663" y="92" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle">5. Execução</text>
  <text x="663" y="114" fill="#cbd5e1" font-size="10" text-anchor="middle">Tarefas UT01–05,</text>
  <text x="663" y="128" fill="#cbd5e1" font-size="10" text-anchor="middle">Think Aloud e</text>
  <text x="663" y="148" fill="#94a3b8" font-size="9" text-anchor="middle">coleta de métricas</text>

  <line x1="726" y1="120" x2="746" y2="120" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Etapa 6 -->
  <rect x="749" y="65" width="122" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="810" y="92" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">6. Pós-teste</text>
  <text x="810" y="114" fill="#cbd5e1" font-size="10" text-anchor="middle">Escala SEQ (1–7),</text>
  <text x="810" y="128" fill="#cbd5e1" font-size="10" text-anchor="middle">entrevista breve</text>
  <text x="810" y="148" fill="#94a3b8" font-size="9" text-anchor="middle">e encerramento</text>

  <line x1="871" y1="120" x2="891" y2="120" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Etapa 7 -->
  <rect x="894" y="65" width="122" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="955" y="92" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">7. Consolidação</text>
  <text x="955" y="114" fill="#cbd5e1" font-size="10" text-anchor="middle">Análise quant/qual</text>
  <text x="955" y="128" fill="#cbd5e1" font-size="10" text-anchor="middle">e comparação c/</text>
  <text x="955" y="148" fill="#94a3b8" font-size="9" text-anchor="middle">Heurística (E13)</text>

  <line x1="1016" y1="120" x2="1036" y2="120" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Etapa 8 -->
  <rect x="1039" y="65" width="122" height="110" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
  <text x="1100" y="92" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle">8. Recomendações</text>
  <text x="1100" y="114" fill="#cbd5e1" font-size="10" text-anchor="middle">Ajustes no Figma</text>
  <text x="1100" y="128" fill="#cbd5e1" font-size="10" text-anchor="middle">e atualização da</text>
  <text x="1100" y="148" fill="#94a3b8" font-size="9" text-anchor="middle">Rastreabilidade</text>
</svg>